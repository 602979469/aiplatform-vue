apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiplatform-vue
  namespace: tsk
  labels:
    app: aiplatform-vue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aiplatform-vue
  template:
    metadata:
      labels:
        app: aiplatform-vue
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - k8s-master
      containers:
        - name: aiplatform-vue
          # 流水线会替换为 aiplatform-vue:<commit 短哈希>
          image: aiplatform-vue:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: aiplatform-vue
  namespace: tsk
  labels:
    app: aiplatform-vue
spec:
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app: aiplatform-vue
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aiplatform-web
  namespace: tsk
  annotations:
    nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: aiplatform.jakt.online
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aiplatform-vue
                port:
                  number: 80
