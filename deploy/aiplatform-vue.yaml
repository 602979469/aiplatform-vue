apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiplatform-vue
  namespace: tsk
  labels:
    app: aiplatform-vue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aiplatform-vue
  template:
    metadata:
      labels:
        app: aiplatform-vue
    spec:
      containers:
        - name: aiplatform-vue
          # 流水线会替换为 aiplatform-vue:<commit 短哈希>
          image: aiplatform-vue:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: aiplatform-vue
  namespace: tsk
  labels:
    app: aiplatform-vue
spec:
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app: aiplatform-vue
---
# 无 host 的 Ingress：直接用 IP 访问（公网 80 → frp → ingress-nginx NodePort）
# /prod-api 去掉前缀转发到后端（对应前端 VUE_APP_BASE_API=/prod-api）
# / 走前端静态资源
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aiplatform-web
  namespace: tsk
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /prod-api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: aiplatform
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aiplatform-vue
                port:
                  number: 80
